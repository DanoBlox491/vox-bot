name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vox Bot
        # This sends a GET request to your Render URL
        run: curl -s https://vox-bot-04l6.onrender.com > /dev/null
